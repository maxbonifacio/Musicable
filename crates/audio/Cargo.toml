[package]
name = "musicable-audio"
description = "Audio device I/O: our own WASAPI backend on Windows, and ASIO with a feature; cpal elsewhere."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# ASIO output on Windows. Builds with it are distributed under the GPLv3:
# see docs/audio.md.
asio = []

[dependencies]
musicable-engine.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
cpal = "0.18"
rtrb.workspace = true

[lints]
workspace = true
