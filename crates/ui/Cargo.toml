[package]
name = "musicable-ui"
description = "User interface. Depends on the model and commands, never the engine directly."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
musicable-model.workspace = true
musicable-commands.workspace = true
egui.workspace = true

[dev-dependencies]
# The tests lay out text, so they need fonts. The app's come with eframe.
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest.workspace = true

[lints]
workspace = true
