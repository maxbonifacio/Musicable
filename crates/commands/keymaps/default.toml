# The default keymap. It follows Ableton Live's shortcuts where Live has one,
# so the keys feel familiar to Live users.
#
# To change your own shortcuts, don't edit this file: put the changes in your
# keymap file, which Musicable reads on top of this one. The manual's Keys
# page (manual/src/customising/keys.md) has the format, and its Every command
# page lists the commands.

format = "musicable-keymap"
version = 1

[bindings]
"transport.play_stop" = ["Space"]
"transport.play" = ["Shift+Space"]
"transport.go_to_start" = ["Home"]
"transport.toggle_loop" = ["Ctrl+L"]
"transport.toggle_metronome" = ["O"]
"transport.record" = ["F9"]
"transport.capture" = ["Ctrl+Shift+C"]

# Live has no keys for these. None of the chords does anything in Live outside
# its MIDI note editor.
"transport.stop" = ["Ctrl+Period"]
"transport.tempo_up" = ["Ctrl+Shift+Up"]
"transport.tempo_down" = ["Ctrl+Shift+Down"]

# Live's keys for undo and redo, and the other common one for redo.
"edit.undo" = ["Ctrl+Z"]
"edit.redo" = ["Ctrl+Y", "Ctrl+Shift+Z"]

# Live's keys for editing the arrangement.
"edit.cut" = ["Ctrl+X"]
"edit.copy" = ["Ctrl+C"]
"edit.paste" = ["Ctrl+V"]
"edit.duplicate" = ["Ctrl+D"]
"edit.delete" = ["Delete", "Backspace"]
"edit.split" = ["Ctrl+E"]
"edit.select_all" = ["Ctrl+A"]
"edit.rename" = ["Ctrl+R"]
"clip.insert_midi_clip" = ["Ctrl+Shift+M"]

# Live's key for Quantize, which moves the notes of the piano roll, the
# transients of the Sample Editor, or else those of the selected clips to the
# grid.
"edit.quantize" = ["Ctrl+U"]

# Live's keys for the arrangement's zoom, the grid and Follow, for showing
# take lanes, for showing the mixer and the devices (Live's Detail View)
# under the arrangement, and for showing the browser and searching in it.
"view.zoom_in" = ["Equals", "NumpadAdd"]
"view.zoom_out" = ["Minus", "NumpadSubtract"]
"view.zoom_to_selection" = ["Z"]
"view.narrow_grid" = ["Ctrl+1"]
"view.widen_grid" = ["Ctrl+2"]
"view.triplet_grid" = ["Ctrl+3"]
"view.toggle_snap" = ["Ctrl+4"]
"view.fixed_grid" = ["Ctrl+5"]
"view.toggle_follow" = ["Ctrl+Shift+F"]
"view.toggle_take_lanes" = ["Ctrl+Alt+U"]
"view.toggle_mixer" = ["Ctrl+Alt+M"]
"view.toggle_devices" = ["Ctrl+Alt+L"]
"view.toggle_browser" = ["Ctrl+Alt+B"]
"browser.focus_search" = ["Ctrl+F"]

# Live's keys for its clip view, which the piano roll stands in for with a
# MIDI clip and the Sample Editor with an audio clip: Live 12 shows and hides
# it with Ctrl+Alt+3, and switches between it and the device view with F12 or
# Shift+Tab. Shift+Tab is left to move the keyboard focus back, as it does
# everywhere else.
"view.toggle_clip_editor" = ["Ctrl+Alt+3"]
"view.switch_devices_piano_roll" = ["F12"]

# Live has no list of the undo history. Its key follows the other panels'.
"view.toggle_history" = ["Ctrl+Alt+H"]

# Live's key for the mixer's In/Out section, which the Routing panel stands in
# for, for the whole project.
"view.toggle_routing" = ["Ctrl+Alt+I"]

# Live has no list of what each device takes of the CPU, and its Ctrl+Alt+P
# shows and hides the plugin windows. C is for CPU, and Live leaves it free.
"view.toggle_performance" = ["Ctrl+Alt+C"]

# Live's key for Draw Mode in its MIDI note editor, which works everywhere.
# The arrow keys are the piano roll's own, under [panels.piano_roll] below.
"notes.toggle_draw" = ["B"]

# Live's A shows every track's automation in Automation Mode. Here it shows
# the selected track's automation lanes, or hides them.
"automation.show" = ["A"]

# Live's keys for new tracks. Live has no key for a new group track: Ctrl+G
# groups the selected tracks, which needs a selection.
"track.new_audio_track" = ["Ctrl+T"]
"track.new_midi_track" = ["Ctrl+Shift+T"]
"track.new_return_track" = ["Ctrl+Alt+T"]

# Live's keys for its own files.
"file.new" = ["Ctrl+N"]
"file.open" = ["Ctrl+O"]
"file.save" = ["Ctrl+S"]
"file.save_as" = ["Ctrl+Shift+S"]
"file.export_audio" = ["Ctrl+Shift+R"]
"file.quit" = ["Ctrl+Q"]

# Live has no workspaces. Alt and a slot's number switch to the workspace in
# that slot, the first being Default.
"workspace.switch_1" = ["Alt+1"]
"workspace.switch_2" = ["Alt+2"]
"workspace.switch_3" = ["Alt+3"]
"workspace.switch_4" = ["Alt+4"]
"workspace.switch_5" = ["Alt+5"]
"workspace.switch_6" = ["Alt+6"]
"workspace.switch_7" = ["Alt+7"]
"workspace.switch_8" = ["Alt+8"]
"workspace.switch_9" = ["Alt+9"]

# The app's windows. Live opens its settings with Ctrl+Comma, and Ctrl+K is
# its key map mode, the nearest it has to changing keys. Live has no command
# palette, and Ctrl+Shift+P is the usual key for one elsewhere.
"options.settings" = ["Ctrl+Comma"]
"options.keyboard_shortcuts" = ["Ctrl+K"]
"view.command_palette" = ["Ctrl+Shift+P"]

# Keys that work in one panel only, while it has the focus, where they win
# over the keys above.
#
# Live's arrow keys for its MIDI note editor act on the notes selected in the
# piano roll. With none selected, they move the keyboard focus between
# controls instead.
[panels.piano_roll]
"notes.transpose_up" = ["Up"]
"notes.transpose_down" = ["Down"]
"notes.octave_up" = ["Shift+Up"]
"notes.octave_down" = ["Shift+Down"]
"notes.nudge_left" = ["Left"]
"notes.nudge_right" = ["Right"]
"notes.shorten" = ["Shift+Left"]
"notes.lengthen" = ["Shift+Right"]
"notes.velocity_up" = ["Ctrl+Up"]
"notes.velocity_down" = ["Ctrl+Down"]

# Live's keys for the warp markers in its sample editor, which the Sample
# Editor stands in for: Ctrl+I adds one at the insert point, where the
# waveform was clicked last, and the arrow keys move the selected ones.
[panels.sample_editor]
"warp.insert_markers" = ["Ctrl+I"]
"warp.nudge_left" = ["Left"]
"warp.nudge_right" = ["Right"]
"transient.insert" = ["Ctrl+Shift+I"]
"transient.delete" = ["Ctrl+Shift+Backspace"]

# The devices panel's keys act on the devices it has selected. Live's 0
# deactivates clips and tracks, and Live has no key for its devices: here 0
# bypasses the devices, or brings them all back if every one is bypassed.
# Ctrl and the arrow keys move them one place along the chain. Ctrl+G stays
# free, for grouping devices later.
[panels.devices]
"device.toggle_bypass" = ["0"]
"device.move_left" = ["Ctrl+Left"]
"device.move_right" = ["Ctrl+Right"]

# The arrow keys step through the History panel's list: Up takes a step back,
# as undo does, and Down makes the next one again, as redo does.
[panels.history]
"edit.undo" = ["Up"]
"edit.redo" = ["Down"]
