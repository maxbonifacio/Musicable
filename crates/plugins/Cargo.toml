[package]
name = "musicable-plugins"
description = "Plugin hosting: CLAP and VST3, then ARA (planned)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# CLAP's C API (1.2.2) as Rust types.
clap-sys = "0.5"
# Loads plugin libraries.
libloading = "0.9"
musicable-engine.workspace = true
musicable-model.workspace = true
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true
# VST3's API (the 3.8 SDK's interfaces) as Rust types, and COM objects in
# Rust.
vst3 = "0.3"

[dev-dependencies]
# Built for its plugin library, which the tests load, and for the hooks into
# it.
musicable-test-plugins = { path = "../test-plugins" }

[lints]
workspace = true
