[package]
name = "musicable-app"
description = "Desktop application: the session wiring commands to the engine, and the binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "musicable"
path = "src/main.rs"

[dependencies]
musicable-model.workspace = true
musicable-commands.workspace = true
musicable-engine.workspace = true
musicable-plugins.workspace = true
musicable-io.workspace = true
musicable-library.workspace = true
musicable-ui.workspace = true
musicable-audio.workspace = true
musicable-mcp.workspace = true
musicable-analysis.workspace = true
eframe.workspace = true
# The main window, which a workspace puts where it was: eframe's own winit,
# and egui's way of maximizing a window that's still hidden.
winit = { version = "0.30", default-features = false }
egui-winit = { version = "0.37", default-features = false }
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
# Pictures of the windows for agents: PNG files, in base64 in the tools' answers.
base64.workspace = true
png.workspace = true
toml.workspace = true
# Reads a theme's font files as egui will, which can't take one it can't
# read. The version egui's text uses.
skrifa = "0.44"
# What egui, wgpu and the app log, which goes to the log file.
log = "0.4"
# The render cache's keys.
siphasher.workspace = true
# audio.convert's resampler.
rubato.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
# Built for its plugin library, which the tests load, and for the hooks into
# it.
musicable-test-plugins = { path = "../test-plugins" }
# Agents' clients, in the tests of agents controlling the app.
rmcp.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
# How much of the disk is free, which the render cache leaves some of.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The main window's HWND, which plugin windows stay in front of.
raw-window-handle = "0.6"
# And how much of the disk is free, for the render cache.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
