[package]
name = "musicable-app"
description = "Desktop application: the session wiring commands to the engine, and the binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "musicable"
path = "src/main.rs"

[dependencies]
musicable-model.workspace = true
musicable-commands.workspace = true
musicable-engine.workspace = true
musicable-plugins.workspace = true
musicable-io.workspace = true
musicable-ui.workspace = true
musicable-audio.workspace = true
eframe.workspace = true
rfd.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Console"] }

[lints]
workspace = true
