[package]
name = "tsm-lab"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Research spike: offline time-scale modification (PGHI phase vocoder + HPR split + onset handling)"
publish = false

[workspace]

[dependencies]
realfft = "3.5"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
opt-level = 3

[profile.test]
opt-level = 3
