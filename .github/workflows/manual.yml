name: Manual

# Builds the manual with mdBook when it changes, and publishes main's to
# GitHub Pages (Settings > Pages > Source: GitHub Actions). The test job in
# ci.yml checks the manual's pages made from the code are up to date
# (CONTRIBUTING.md#the-manual).

on:
  push:
    branches: [main]
    paths:
      - "manual/**"
      - ".github/workflows/manual.yml"
  pull_request:
    paths:
      - "manual/**"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

# Read-only, but for the deploy job's own permissions.
permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/mdbook"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/mdbook"
          echo "$HOME/mdbook" >> "$GITHUB_PATH"
      - run: mdbook build manual
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: manual/book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time: a running one finishes, and the latest one
    # waiting goes next.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
