name: CI

# Which machine runs each job: GitHub's hosted runners, or one of our own
# when a repository variable names its label (docs/ci-runners.md):
# RUNNER_WINDOWS, RUNNER_LINUX and RUNNER_MACOS. A pull request from a fork
# always runs on hosted runners, never on our machines. macOS runs on every
# push while the repository is public, where hosted runners are free, and
# otherwise nightly on main and when run by hand.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Read-only: no job writes to the repository.
permissions:
  contents: read

# A new push to a pull request cancels its run still going, as does a new
# nightly run the last one, if it's still waiting for a Mac. Each push to main
# gets a group of its own, so every merge is tested.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ !github.event.pull_request.head.repo.fork && (matrix.os == 'windows-latest' && vars.RUNNER_WINDOWS || matrix.os == 'ubuntu-latest' && vars.RUNNER_LINUX || matrix.os == 'macos-latest' && vars.RUNNER_MACOS) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary platform; the others keep the build portable.
        # The schedule runs macOS alone, as Windows and Linux ran on each push
        # to main.
        os: ${{ fromJSON(github.event_name == 'schedule' && '["macos-latest"]' || (github.event_name == 'workflow_dispatch' || github.event.repository.private == false) && '["windows-latest", "macos-latest", "ubuntu-latest"]' || '["windows-latest", "ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # cpal's ALSA backend needs the ALSA headers. Our own Linux runner has
      # them already, so it needs no password for sudo.
      - if: runner.os == 'Linux'
        run: dpkg -s libasound2-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libasound2-dev)
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Beat This! models, which the analysis tests need and the
      # repository leaves out: fetched by the script, checked against its
      # pinned hashes, and kept until the script changes. Without them, the
      # tests that use them fail here, where they'd skip on a PC.
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch-models.sh') }}
      - run: sh scripts/fetch-models.sh
        shell: bash
      # A debug build, so the engine's allocation checker is on: the
      # equivalence tests, the real-time checks, the file round trips and the
      # Tier 0 demo all run with it, and the ASIO host's tests play a fake
      # driver on every platform (docs/audio.md#asio). The benchmarks are in
      # bench.yml.
      - run: cargo test --workspace

  fmt:
    if: github.event_name != 'schedule'
    runs-on: ${{ !github.event.pull_request.head.repo.fork && vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ${{ !github.event.pull_request.head.repo.fork && vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        shell: bash
        run: |
          missing=0
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha is missing a Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
