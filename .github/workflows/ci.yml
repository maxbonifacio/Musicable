name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: no job writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary platform; the others keep the build portable.
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # cpal's ALSA backend needs the ALSA headers.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The ASIO build (docs/audio.md#asio): the whole app on Windows, and
      # elsewhere the ASIO host's tests, which play a fake driver.
      - run: cargo clippy --workspace --all-targets --features musicable-app/asio -- -D warnings
      # A debug build, so the engine's allocation checker is on: the
      # equivalence tests, the real-time checks, the file round trips and the
      # Tier 0 demo all run with it. The benchmarks are in bench.yml.
      - run: cargo test --workspace
      - run: cargo test -p musicable-audio --features asio

  asio-opt-in:
    name: ASIO stays opt-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Builds with the asio feature are distributed under the GPLv3, so
      # nothing in the default build may turn it on, on any platform.
      - name: Check the default build leaves ASIO out
        shell: bash
        run: |
          features() {
            cargo tree --workspace --target all -e features -i musicable-audio "$@"
          }
          if ! features --features musicable-app/asio | grep -q 'feature "asio"'; then
            echo "::error::cargo tree doesn't show the asio feature even when it's on, so this check can't see it"
            exit 1
          fi
          if features | grep 'feature "asio"'; then
            echo "::error::The default build turns on musicable-audio's asio feature"
            exit 1
          fi

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        shell: bash
        run: |
          missing=0
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha is missing a Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
