name: Benchmarks

# The scheduler benchmarks on Windows, the first-class platform, whenever the
# engine changes. Each run's numbers are in its summary, and its raw data in
# its artifact for 90 days. Hosted runners are small shared virtual machines:
# four logical processors for a public repository, and two on one physical
# core for a private one. The benchmarks run one thread per logical processor
# there, so the parallel renderer has three workers at most, and the numbers
# are rough and say little about scaling: they catch big slowdowns and keep
# the benchmarks working. Tune the scheduler on real hardware (see
# CONTRIBUTING.md). With RUNNER_WINDOWS set, they run on our own Windows
# machine instead (docs/ci-runners.md), whose numbers are real but move with
# whatever else it's doing.

on:
  push:
    branches: [main]
    paths:
      - "crates/engine/**"
      - "crates/model/**"
      - "Cargo.lock"
      - ".github/workflows/bench.yml"
  pull_request:
    paths:
      - "crates/engine/**"
      - "crates/model/**"
      - "Cargo.lock"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

# Read-only: the benchmarks write only their summary and their artifact.
permissions:
  contents: read

# A new push to a pull request cancels its run still going. Each push to
# main gets a group of its own, so every merge is checked.
concurrency:
  group: bench-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Benchmarks (Windows)
    runs-on: ${{ !github.event.pull_request.head.repo.fork && vars.RUNNER_WINDOWS || 'windows-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Describe the runner
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $threads = $cpu.NumberOfLogicalProcessors
          # By physical cores, the benchmarks would measure one thread only.
          Add-Content -Path $env:GITHUB_ENV -Value "MUSICABLE_BENCH_THREADS=$threads"
          $line = "Runner: $($cpu.Name), $($cpu.NumberOfCores) cores, " +
            "$threads logical processors. The benchmarks use up to $threads threads."
          Write-Output $line
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "$line`n"
      - name: Block times, from one thread to one per logical processor
        shell: bash
        run: |
          cargo bench -p musicable-engine --bench scheduler -- --noplot --output-format bencher | tee scheduler.txt
          {
            echo "# Block times"
            echo
            echo '```'
            grep '^test ' scheduler.txt
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Tables at a device's pace
        shell: bash
        run: |
          cargo bench -p musicable-engine --bench realtime | tee realtime.md
          cat realtime.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks
          path: |
            scheduler.txt
            realtime.md
            target/criterion
          retention-days: 90
