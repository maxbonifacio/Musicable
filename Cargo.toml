[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[workspace.dependencies]
musicable-model = { path = "crates/model" }
musicable-commands = { path = "crates/commands" }
musicable-engine = { path = "crates/engine" }
musicable-plugins = { path = "crates/plugins" }
musicable-io = { path = "crates/io" }
musicable-ui = { path = "crates/ui" }
rtrb = "0.4"
num_cpus = "1.17"
# Dev-only: property tests and benchmarks.
proptest = { version = "1.11", default-features = false, features = ["std"] }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
