[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
musicable-model = { path = "crates/model" }
musicable-commands = { path = "crates/commands" }
musicable-engine = { path = "crates/engine" }
musicable-audio = { path = "crates/audio" }
musicable-plugins = { path = "crates/plugins" }
musicable-io = { path = "crates/io" }
musicable-library = { path = "crates/library" }
musicable-ui = { path = "crates/ui" }
musicable-mcp = { path = "crates/mcp" }
musicable-analysis = { path = "crates/analysis" }
musicable-stretch = { path = "crates/stretch" }
rtrb = "0.4"
base64 = "0.22"
# Decodes FLAC frames; finding them is ours (io::audio).
claxon = "0.4"
serde = { version = "1", features = ["derive"] }
# float_roundtrip reads every float back exactly as it was written.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
toml = "1"
# The app shell: egui in a winit window, drawn with wgpu, and native file dialogs.
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui = "0.37"
# Splits and tabs for the window's panels, which the user drags about.
egui_tiles = { version = "0.18", default-features = false }
rfd = "0.17"
num_cpus = "1.17"
# Finds a search's words in the browser's library.
memchr = "2.8"
# Lets agents control the app over MCP, the Model Context Protocol: the
# official Rust SDK, its server in the app and its client in the bridge.
rmcp = { version = "3.7", default-features = false, features = ["client", "server"] }
# The MCP server's runtime, on a thread of its own, and the bridge's.
tokio = { version = "1.54", features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
# The analysis's spectral flux, which finds onsets and the tempo.
realfft = "3.5"
# The Beat This! beat and downbeat network, on the pure-Rust rten runtime.
# Its model files aren't committed: scripts/fetch-models.sh fetches them.
beat-this = { version = "1.1", default-features = false }
# Changes audio files' sample rates in the audio toolkit: what beat-this
# resamples with too.
rubato = "3.0"
# What beat-this runs on, for running it on threads of the analysis's own.
rten = "0.24"
rten-tensor = "0.24"
rayon = "1.11"
anyhow = "1.0"
# Reads Live Sets, which are gzipped XML, for scoring analysis against
# Live's auto-warp.
flate2 = "1.1"
# Names the analysis cache's entries: SipHash, whose hashes stay the same
# from one Rust release to the next, as std's needn't.
siphasher = "1.0"
# Builds Signalsmith Stretch's and Rubber Band's C++ for musicable-stretch.
cc = "1.2"
# Dev-only: property tests and benchmarks.
proptest = { version = "1.11", default-features = false, features = ["std"] }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
egui_kittest = "0.37"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Set in RTSan builds: see crates/engine/src/rt.rs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(musicable_rtsan)"] }

[workspace.lints.clippy]
all = "warn"

# The Beat This! network takes minutes for a few seconds of audio when its
# runtime is built unoptimised, so it builds optimised in tests and debug
# builds too.
[profile.dev.package.beat-this]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-onnx]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
