[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
musicable-model = { path = "crates/model" }
musicable-commands = { path = "crates/commands" }
musicable-engine = { path = "crates/engine" }
musicable-audio = { path = "crates/audio" }
musicable-plugins = { path = "crates/plugins" }
musicable-io = { path = "crates/io" }
musicable-ui = { path = "crates/ui" }
rtrb = "0.4"
# Decodes FLAC frames; finding them is ours (io::audio).
claxon = "0.4"
serde = { version = "1", features = ["derive"] }
# float_roundtrip reads every float back exactly as it was written.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
toml = "1"
# The app shell: egui in a winit window, drawn with wgpu, and native file dialogs.
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui = "0.37"
rfd = "0.17"
num_cpus = "1.17"
# Dev-only: property tests and benchmarks.
proptest = { version = "1.11", default-features = false, features = ["std"] }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
egui_kittest = "0.37"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
